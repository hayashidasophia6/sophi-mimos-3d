
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sophi Mimos 3D</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #fff5fa;
  color: #333;
  text-align: center;
}
header {
  background: #ff1493;
  color: white;
  padding: 35px 15px;
}
nav {
  background: #ead5f7;
  padding: 18px;
}
nav a {
  color: #333;
  margin: 10px;
  text-decoration: none;
  font-weight: bold;
}
.produto {
  background: white;
  padding: 25px;
  margin: 25px auto;
  max-width: 320px;
  border-radius: 20px;
  box-shadow: 0 4px 12px #0002;
}
button {
  background: #ff1493;
  color: white;
  border: none;
  border-radius: 12px;
  padding: 14px 20px;
  cursor: pointer;
}
footer {
  padding: 25px;
}
</style>
</head>
<body>
<header>
  <h1>💗 Sophi Mimos 3D</h1>
  <p>Personagens 3D feitos com carinho!</p>
</header>
<nav>
  <a href="#inicio">Início</a>
  <a href="#produtos">Produtos</a>
  <a href="#contato">Contato</a>
</nav>
<main id="inicio">
  <h2>Bem-vindo à nossa lojinha! 🎀</h2>
  <p>Escolha seus personagens favoritos!</p>
  <section id="produtos">
    <h2>🛍️ Nossos produtos</h2>
    <div class="produto">
      <h3>Personagens 3D</h3>
      <p>Escolha seu personagem e suas cores!</p>
      <button onclick="alert('Catálogo em breve!')">
        Ver opções
      </button>
    </div>
  </section>
</main>
<footer id="contato">
  💗 Sophi Mimos 3D — Feito com carinho
</footer>
</body>
</html>
